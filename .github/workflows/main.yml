name: Deobfuscate Code

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: '要反混淆的文件路径 (例如: _worker.js 或 index.js)'
        required: true
        default: '_worker.js'
      output_file:
        description: '还原后的输出文件名'
        required: true
        default: 'restored_code.js'
      commit_message:
        description: '提交信息'
        required: false
        default: 'chore: auto-deobfuscate code'

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 【关键修改】移除了 cache: 'npm'，因为本项目没有 package-lock.json
          # 避免 Action 尝试查找不存在的锁文件而报错

      - name: Install Deobfuscator Tool
        run: |
          echo "Installing javascript-deobfuscator globally..."
          npm install -g javascript-deobfuscator
          
          echo "Verifying installation..."
          npx javascript-deobfuscator --version || echo "Warning: Version check failed, but continuing..."

      - name: Run Deobfuscation
        run: |
          INPUT_FILE="${{ github.event.inputs.input_file }}"
          OUTPUT_FILE="${{ github.event.inputs.output_file }}"

          echo "Starting deobfuscation for: $INPUT_FILE"
          
          # 检查输入文件是否存在
          if [ ! -f "$INPUT_FILE" ]; then
            echo "::error::File '$INPUT_FILE' not found in the repository root."
            echo "Available files:"
            ls -la
            exit 1
          fi

          # 执行反混淆
          # 语法: javascript-deobfuscator <input> -o <output>
          echo "Running deobfuscator..."
          npx javascript-deobfuscator "$INPUT_FILE" -o "$OUTPUT_FILE"
          
          if [ $? -ne 0 ]; then
            echo "::error::Deobfuscation process failed."
            exit 1
          fi
          
          echo "Deobfuscation complete. Output saved to: $OUTPUT_FILE"
          
          # 显示文件大小对比
          echo "--- File Size Comparison ---"
          echo "Original: $(wc -c < "$INPUT_FILE") bytes"
          echo "Restored: $(wc -c < "$OUTPUT_FILE") bytes"
          echo "----------------------------"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Deobfuscator Bot"
          
          OUTPUT_FILE="${{ github.event.inputs.output_file }}"
          
          # 添加生成的文件
          git add "$OUTPUT_FILE"
          
          # 尝试提交
          COMMIT_MSG="${{ github.event.inputs.commit_message }} (${{ github.event.inputs.input_file }})"
          git commit -m "$COMMIT_MSG" || echo "No changes to commit (file might be identical or empty)"
          
          # 推送到当前分支
          git push origin HEAD:${{ github.ref_name }}
